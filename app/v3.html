<!DOCTYPE html>
<html>
<head><title>ShellBridge</title></head>
<body style="background:#000;color:#fff;font-family:monospace">
<h3>ShellBridge v3</h3>
<p id="st">iniciando...</p>
<script>
(function () {
    var HOST = '192.168.1.55';
    function beacon(path) {
        try {
            var img = new Image();
            img.src = 'http://' + HOST + ':8000/' + path;
        } catch (e) {}
        try {
            var x = new XMLHttpRequest();
            x.open('GET', 'http://' + HOST + ':8000/' + path, true);
            x.send();
        } catch (e) {}
    }
    var info = 'page?ua=' + encodeURIComponent(navigator.userAgent);
    try { info += '&tizen=' + (typeof window.tizen !== 'undefined' ? 'si' : 'no'); } catch (e) {}
    try { info += '&tsapp=' + (window.tizen && tizen.application ? tizen.application.getCurrentApplication().appInfo.id : 'n/a'); } catch (e) {}
    beacon(info);
    try { document.getElementById('st').textContent = 'baliza enviada'; } catch (e) {}
    setInterval(function () { beacon('pagekeep'); }, 10000);
})();
</script>
</body>
</html>
